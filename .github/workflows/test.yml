name: test

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node: '20'
          - os: ubuntu-latest
            node: '22'
          - os: macos-latest
            node: '20'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: sudo apt-get update && sudo apt-get install -y tmux
        if: runner.os == 'Linux'
      - run: brew install tmux
        if: runner.os == 'macOS'
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm test -- --exclude test/commands.test.js --exclude test/workspaceDocker.test.js --exclude test/workspaceHost.test.js
        working-directory: server
      - run: npm run test:workspace-host
        if: matrix.node == '20'
        working-directory: server
      - run: npm run test:workspace-docker
        if: runner.os == 'Linux' && matrix.node == '20'
        working-directory: server

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npx vitest run
        working-directory: web
      - run: npm run build
        working-directory: web

  package:
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: web
      - run: npm run test:pack
        working-directory: server
