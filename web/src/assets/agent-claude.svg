<!-- The Claude Code CLI's own startup glyph: the pixel robot its banner draws out of block characters. Reproduced cell for cell with the terminal's own colours (ink = 256-colour 174, plate = 256-colour 16), keeping the terminal's 1:2 cell so the figure stays wider than it is tall. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(0 4.0) scale(1.3333333333333333)"><rect x="5" y="2" width="1" height="2" fill="#000000"/><rect x="13" y="2" width="1" height="2" fill="#000000"/><rect x="3" y="0" width="13" height="2" fill="#d7af87"/><rect x="3" y="2" width="2" height="2" fill="#d7af87"/><rect x="6" y="2" width="7" height="2" fill="#d7af87"/><rect x="14" y="2" width="2" height="2" fill="#d7af87"/><rect x="1" y="4" width="17" height="2" fill="#d7af87"/><rect x="3" y="6" width="13" height="2" fill="#d7af87"/><rect x="5" y="8" width="1" height="2" fill="#d7af87"/><rect x="7" y="8" width="1" height="2" fill="#d7af87"/><rect x="11" y="8" width="1" height="2" fill="#d7af87"/><rect x="13" y="8" width="1" height="2" fill="#d7af87"/></g></svg>
