<!-- The Claude Code CLI's own startup glyph: the pixel robot its banner draws out of block characters, in the terminal's own geometry (it emits 256-colour 174 for the ink; the mark now takes the tab's text colour like every other Agent mark). The two eyes are not drawn, so the tab shows through them — the black plate the CLI paints behind them cannot work on a light background. The viewBox is the artwork's own box inset 7.5% horizontally, so the mark renders 7% narrower than its cap, and one path keeps every internal seam closed. -->
